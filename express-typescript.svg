<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Express Scaffolding TypeScript</title>
  <desc id="desc">README banner for an Express.js project scaffolder using Node.js and TypeScript.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF3F8"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3C873A"/>
      <stop offset="50%" stop-color="#20232A"/>
      <stop offset="100%" stop-color="#3178C6"/>
    </linearGradient>

    <linearGradient id="tsBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E8DDA"/>
      <stop offset="100%" stop-color="#235A9F"/>
    </linearGradient>

    <clipPath id="nodeClip">
      <rect x="980" y="110" width="340" height="220" rx="24"/>
    </clipPath>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F1720" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="600" rx="42" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="552" rx="34" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="3" filter="url(#shadow)"/>

  <rect x="24" y="24" width="1552" height="12" rx="6" fill="url(#accent)"/>

  <!-- Express.js wordmark treatment -->
  <g transform="translate(110 115)">
    <path d="M0 85 H105 M18 125 H135 M42 165 H120" stroke="#3C873A" stroke-width="12" stroke-linecap="round"/>
    <text x="155" y="150" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="300" letter-spacing="1" fill="#20232A">express</text>
    <text x="158" y="205" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="9" fill="#6B7680">PROJECT SCAFFOLDER</text>
  </g>

  <!-- Node.js artwork from the supplied image -->
  <g clip-path="url(#nodeClip)">
    <rect x="980" y="110" width="340" height="220" rx="24" fill="#FFFFFF"/>
    <image x="980" y="110" width="340" height="220"
           preserveAspectRatio="xMidYMid meet"
           href="data:image/jpeg;base64,"/>
  </g>

  <!-- TypeScript icon -->
  <g transform="translate(1330 125)">
    <rect width="180" height="180" rx="28" fill="url(#tsBox)"/>
    <text x="90" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="700" fill="#FFFFFF">TS</text>
  </g>

  <!-- Code panel -->
  <g transform="translate(110 365)">
    <rect width="1360" height="125" rx="22" fill="#F4F7FA" stroke="#D9E1E8" stroke-width="3"/>
    <circle cx="38" cy="34" r="8" fill="#C6D0D9"/>
    <circle cx="64" cy="34" r="8" fill="#3C873A"/>
    <circle cx="90" cy="34" r="8" fill="#3178C6"/>

    <path d="M135 36 H290 M135 70 H380 M135 102 H255" stroke="#3C873A" stroke-width="10" stroke-linecap="round"/>
    <path d="M325 36 H505 M415 70 H690 M285 102 H560" stroke="#AAB5BF" stroke-width="10" stroke-linecap="round"/>
    <path d="M540 36 H720 M725 70 H980 M600 102 H880" stroke="#3178C6" stroke-width="10" stroke-linecap="round"/>
    <path d="M1025 36 H1220 M1010 70 H1260 M930 102 H1160" stroke="#AAB5BF" stroke-width="10" stroke-linecap="round"/>
  </g>

  <text x="800" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="7" fill="#56616B">NODE.JS · EXPRESS.JS · TYPESCRIPT</text>
</svg>
